name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Prepare release bundle
        shell: bash
        run: |
          mkdir -p release-bundle
          cp main.js manifest.json styles.css README.md LICENSE prompt.md skill.md release-bundle/
          cd release-bundle
          zip -r ../omnisearch-mcp-${GITHUB_REF_NAME}.zip .
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            omnisearch-mcp-${{ github.ref_name }}.zip
          generate_release_notes: true
